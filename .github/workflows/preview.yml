name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync PR Files to gh-pages Branch
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: preview
          comment: false

      - name: Wait for GitHub Pages Deployment to Complete
        id: wait
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for GitHub Pages to initiate deployment..."
          for i in {1..12}; do
            RUN_ID=$(gh run list --workflow pages-build-deployment --branch gh-pages --limit 1 --json databaseId,status -q '.[0].databaseId')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Watching GitHub Pages deployment run: $RUN_ID"
              gh run watch "$RUN_ID" --exit-status
              break
            fi
            echo "Waiting for deployment run to register ($i/12)..."
            sleep 5
          done

          echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Post Live Preview Comment
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.0
        with:
          header: pr-preview
          message: |
            ### 🚀 PR Preview is Live!
            
            :link: **[https://drapeau.dev/preview/pr-${{ github.event.number }}/](https://drapeau.dev/preview/pr-${{ github.event.number }}/)**
            
            - **Status**: ✅ GitHub Pages deployment complete
            - **Updated**: ${{ steps.wait.outputs.time }}


