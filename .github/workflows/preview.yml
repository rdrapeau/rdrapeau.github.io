name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: read
      actions: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Test Suite
        if: github.event.action != 'closed'
        run: npm test

      - name: Sync PR Files to gh-pages Branch
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: preview
          comment: false

      - name: Wait for GitHub Pages Deployment to Complete
        id: wait
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for GitHub Pages to initiate deployment..."
          for i in {1..12}; do
            RUN_ID=$(gh run list --workflow pages-build-deployment --branch gh-pages --limit 1 --json databaseId,status -q '.[0].databaseId')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "Watching GitHub Pages deployment run: $RUN_ID"
              gh run watch "$RUN_ID" --exit-status
              break
            fi
            echo "Waiting for deployment run to register ($i/12)..."
            sleep 5
          done

          echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Post Live Preview Comment
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-preview
          message: |
            ### 🚀 PR Preview is Live!
            
            :link: **[https://drapeau.dev/preview/pr-${{ github.event.number }}/](https://drapeau.dev/preview/pr-${{ github.event.number }}/)**
            
            - **Status**: ✅ GitHub Pages deployment complete
            - **Updated**: ${{ steps.wait.outputs.time }}


